<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentry — Live Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0D14; --surface: #12161F; --surface-2: #1A1F2C; --line: #232938;
    --text: #E7EBF3; --text-dim: #8B93A7;
    --signal: #00E5A0; --danger: #FF4368; --amber: #FFB84D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; margin: 0; }
  .status { font-size: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .status.connected .dot { background: var(--signal); box-shadow: 0 0 8px var(--signal); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 12px 20px; color: var(--text-dim); font-weight: 400; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  td { padding: 12px 20px; border-bottom: 1px solid var(--line); }
  tr:hover td { background: var(--surface); }
  .score { font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .score.good { color: var(--signal); } .score.warn { color: var(--amber); } .score.bad { color: var(--danger); }
  .flags { color: var(--text-dim); font-size: 11.5px; max-width: 420px; }
  .flag-bad { color: var(--danger); display: block; }
  .empty { padding: 60px; text-align: center; color: var(--text-dim); }
</style>
</head>
<body>
<header>
  <h1>SENTRY — LIVE SCAN</h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
</header>
<table>
  <thead>
    <tr><th>Token</th><th>Age</th><th>Trust score</th><th>Flags</th></tr>
  </thead>
  <tbody id="feed"></tbody>
</table>
<div class="empty" id="emptyMsg">Waiting for the first token to launch…</div>

<script>
  const feedEl = document.getElementById('feed');
  const emptyMsg = document.getElementById('emptyMsg');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const rows = new Map();

  function scoreClass(s) { return s >= 70 ? 'good' : s >= 40 ? 'warn' : 'bad'; }

  function upsertRow(token) {
    emptyMsg.style.display = 'none';
    let tr = rows.get(token.id);
    if (!tr) {
      tr = document.createElement('tr');
      feedEl.prepend(tr);
      rows.set(token.id, tr);
    }
    const ageSec = Math.max(0, Math.round((Date.now() - token.createdAt) / 1000));
    const chainLabel = token.chain === 'robinhood' ? 'ROBINHOOD CHAIN' : 'PUMP.FUN / SOLANA';
    tr.innerHTML = `
      <td><b>${token.symbol || '???'}</b><br><span style="color:var(--text-dim);font-size:11px">${chainLabel} · ${short(token.id)}</span></td>
      <td>${ageSec}s</td>
      <td class="score ${scoreClass(token.score)}">${token.score}</td>
      <td class="flags">${(token.flags || []).map(f => `<span class="flag-bad">⚠ ${f}</span>`).join('') || '—'}</td>
    `;
  }

  function short(addr) { return addr ? addr.slice(0,4) + '…' + addr.slice(-4) : '—'; }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/live`);

    ws.onopen = () => { statusEl.classList.add('connected'); statusText.textContent = 'live'; };
    ws.onclose = () => { statusEl.classList.remove('connected'); statusText.textContent = 'reconnecting…'; setTimeout(connect, 2000); };

    ws.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'snapshot') data.tokens.forEach(upsertRow);
      if (data.type === 'token' || data.type === 'update') upsertRow(data.token);
    };
  }
  connect();
</script>
</body>
</html>
