<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentry</title>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>
  :root {
    --bg: #0D070A; --surface: #180D12; --surface-2: #22131A; --line: #3D1B26;
    --text: #F5E8ED; --text-dim: #B08696; --text-faint: #6E4351;
    --signal: #00E5A0; --danger: #FF2D4E; --amber: #FFB84D;
    --sol-a: #FF3D68; --sol-b: #8B2FD9;
    --rh: #FF8A3D;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --disp: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); }

  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------------- sidebar ---------------- */
  .sidebar {
    width: 340px; flex-shrink: 0;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    background: var(--surface);
  }
  .brand-row {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 16px 14px;
    position: relative;
  }
  .logo-wrap { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
  .logo-wrap::before {
    content: '';
    position: absolute; inset: -10px;
    background: radial-gradient(circle, rgba(255,61,104,0.45), rgba(139,47,217,0.25) 55%, transparent 75%);
    filter: blur(9px);
    animation: glowPulse 3s ease-in-out infinite;
    z-index: 0;
  }
  .logo-wrap svg { position: relative; z-index: 1; width: 100%; height: 100%; }
  @keyframes glowPulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }

  .brand-row h1 {
    font-family: var(--disp); font-weight: 800; font-size: 19px; margin: 0;
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, #FFB84D, var(--sol-a), var(--sol-b));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,61,104,0.35));
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; transform: scaleY(1); }
    25% { opacity: 0.85; transform: scaleY(1.04) translateY(-0.3px); }
    50% { opacity: 0.95; transform: scaleY(0.97); }
    75% { opacity: 0.9; transform: scaleY(1.02); }
  }
  .flame-path { animation: flicker 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  .logo-glow { filter: drop-shadow(0 0 6px rgba(255,61,104,0.55)); overflow: visible; }
  @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .globe-rotate { animation: slowSpin 22s linear infinite; transform-origin: 12px 13.5px; }
  @keyframes emberRise {
    0% { opacity: 0; transform: translateY(0) scale(0.6); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-13px) scale(0.2); }
  }
  .ember { animation: emberRise 2.6s ease-in infinite; }

  .chain-status { display: flex; gap: 8px; padding: 0 16px 12px; }
  .chip {
    display: flex; align-items: center; gap: 5px;
    font-size: 9.5px; letter-spacing: 0.03em; font-weight: 600;
    padding: 4px 8px 4px 6px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); }
  .chip.live .dot { background: var(--signal); box-shadow: 0 0 6px var(--signal); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .chip.sol { color: var(--sol-a); }
  .chip.rh { color: var(--rh); }

  .search-box {
    margin: 0 16px 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    transition: border-color .15s;
  }
  .search-box:focus { border-color: var(--sol-b); }
  .search-box::placeholder { color: var(--text-faint); }

  .tabs { display: flex; gap: 5px; overflow-x: auto; padding: 0 16px 10px; }
  .tab {
    flex-shrink: 0;
    font-family: var(--disp); font-weight: 600; font-size: 10.5px;
    padding: 5px 10px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text-dim); cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .token-list { flex: 1; overflow-y: auto; border-top: 1px solid var(--line); }
  .token-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
    position: relative;
  }
  .token-row:hover { background: var(--surface-2); }
  .token-row.selected { background: var(--surface-2); }
  .token-row.selected::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .token-row.selected.sol::before { background: linear-gradient(180deg, var(--sol-a), var(--sol-b)); }
  .token-row.selected.rh::before { background: var(--rh); }
  .row-main { flex: 1; min-width: 0; }
  .row-sym { font-family: var(--disp); font-weight: 700; font-size: 13px; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, var(--sol-a), var(--sol-b));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--disp); font-weight: 800; font-size: 13px; color: #fff;
    box-shadow: 0 0 0 1px var(--line);
  }
  .avatar.rh { background: linear-gradient(135deg, var(--rh), #FFD166); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-lg { width: 56px; height: 56px; font-size: 20px; }
  .row-sub { font-size: 9.5px; color: var(--text-faint); margin-top: 1px; }
  .row-right { text-align: right; flex-shrink: 0; }
  .row-score { font-family: var(--disp); font-weight: 700; font-size: 14px; }
  .row-mcap { font-size: 9.5px; color: var(--text-faint); margin-top: 1px; }
  .good { color: var(--signal); } .warn { color: var(--amber); } .bad { color: var(--danger); }

  .list-empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 11.5px; line-height: 1.6; }

  /* ---------------- main panel ---------------- */
  .main { flex: 1; overflow-y: auto; background: var(--bg); }
  .main-empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 13px; flex-direction: column; gap: 8px;
  }

  .detail { max-width: 760px; margin: 0 auto; padding: 28px 24px 60px; }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .detail-sym { font-family: var(--disp); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
  .detail-chain { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; margin-top: 4px; }
  .detail-chain.sol { color: var(--sol-a); } .detail-chain.rh { color: var(--rh); }
  .detail-score { text-align: right; }
  .detail-score .num { font-family: var(--disp); font-weight: 700; font-size: 34px; line-height: 1; }
  .detail-score .lbl { font-size: 9.5px; color: var(--text-faint); letter-spacing: 0.05em; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
  .stat-cell { background: var(--surface); padding: 12px; }
  .stat-cell .lbl { font-size: 9px; color: var(--text-faint); letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-cell .val { font-family: var(--disp); font-weight: 700; font-size: 14px; }
  @media (max-width: 620px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

  .chart-wrap {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    margin-bottom: 18px; background: var(--surface); min-height: 380px;
    position: relative;
  }
  .chart-wrap iframe { width: 100%; height: 380px; border: none; display: block; }
  .chart-fallback {
    height: 380px; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--text-faint); font-size: 12px; padding: 20px; text-align: center;
  }

  .section { margin-bottom: 20px; }
  .section h3 { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 10px; font-weight: 600; }

  .flag-list { display: flex; flex-direction: column; gap: 8px; }
  .flag-item { font-size: 12.5px; padding: 10px 12px; border-radius: 8px; background: rgba(255,45,78,0.08); border: 1px solid rgba(255,45,78,0.25); }
  .flag-item.ok { background: rgba(0,229,160,0.08); border-color: rgba(0,229,160,0.25); }

  .addr-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
    font-size: 11.5px; word-break: break-all; margin-bottom: 10px;
  }
  .copy-btn {
    background: none; color: var(--text-dim);
    font-family: var(--mono); font-size: 10.5px; cursor: pointer;
    padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line);
    white-space: nowrap; flex-shrink: 0;
  }
  .copy-btn:hover { color: var(--text); border-color: #3A4258; }
  .copy-btn.copied { color: var(--signal); border-color: var(--signal); }

  .action-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .action-btn {
    flex: 1; text-align: center; text-decoration: none;
    font-family: var(--disp); font-weight: 600; font-size: 12.5px;
    padding: 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--text);
    transition: background .15s, border-color .15s;
  }
  .action-btn:hover { background: var(--surface-2); }
  .action-btn.primary.sol { border-color: rgba(255,61,104,0.3); color: var(--sol-a); }
  .action-btn.primary.sol:hover { background: rgba(255,61,104,0.08); }
  .action-btn.primary.rh { border-color: rgba(255,138,61,0.35); color: var(--rh); }
  .action-btn.primary.rh:hover { background: rgba(255,138,61,0.08); }

  .trade-panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); }
  .trade-warning {
    font-size: 10.5px; color: var(--amber);
    background: rgba(255,184,77,0.08); border: 1px solid rgba(255,184,77,0.25);
    border-radius: 7px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.5;
  }
  .connect-btn { width: 100%; padding: 11px; border-radius: 8px; background: var(--sol-a); color: #04140D; border: none; font-family: var(--disp); font-weight: 700; font-size: 13px; cursor: pointer; }
  .connect-btn:hover { opacity: 0.9; }
  .wallet-pill { font-size: 11px; color: var(--sol-a); font-family: var(--mono); display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .side-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .side-btn { flex: 1; padding: 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-dim); font-family: var(--disp); font-weight: 700; font-size: 12px; cursor: pointer; }
  .side-btn.active.buy { background: rgba(0,229,160,0.12); border-color: var(--signal); color: var(--signal); }
  .side-btn.active.sell { background: rgba(255,45,78,0.12); border-color: var(--danger); color: var(--danger); }
  .amount-input { width: 100%; padding: 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-family: var(--mono); font-size: 14px; margin-bottom: 10px; outline: none; }
  .amount-input:focus { border-color: var(--sol-b); }
  .execute-btn { width: 100%; padding: 11px; border-radius: 8px; border: none; font-family: var(--disp); font-weight: 700; font-size: 13px; cursor: pointer; }
  .execute-btn.buy { background: var(--signal); color: #04140D; }
  .execute-btn.sell { background: var(--danger); color: #1A0509; }
  .execute-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .trade-status { font-size: 11.5px; margin-top: 10px; padding: 8px 10px; border-radius: 7px; }
  .trade-status.pending { background: rgba(139,47,217,0.1); color: #C9A8FF; }
  .trade-status.success { background: rgba(0,229,160,0.1); color: var(--signal); }
  .trade-status.error { background: rgba(255,45,78,0.1); color: var(--danger); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--signal); color: var(--signal);
    padding: 10px 18px; border-radius: 100px; font-size: 12px;
    opacity: 0; transition: opacity .2s, transform .2s; z-index: 50; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: 46vh; border-right: none; border-bottom: 1px solid var(--line); }
    .main { height: 54vh; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand-row">
      <div class="logo-wrap">
      <svg class="logo-glow" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" overflow="visible">
        <defs>
          <linearGradient id="fireGrad" x1="6" y1="34" x2="34" y2="2" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8B2FD9"/>
            <stop offset="55%" stop-color="#FF3D68"/>
            <stop offset="100%" stop-color="#FFB84D"/>
          </linearGradient>
          <path id="flameShape" d="M0 0C0 0 -2.2 3.2 -2.2 5.2C-2.2 6.6 -1.2 7.6 0 7.6C1.2 7.6 2.2 6.6 2.2 5.2C2.2 4.4 1.7 3.6 1.2 3C1.2 3.5 0.9 3.9 0.5 4.1C0.7 3.3 0.4 1.8 0 0Z" fill="url(#fireGrad)"/>
        </defs>

        <!-- globe -->
        <circle cx="20" cy="22" r="10.4" stroke="url(#fireGrad)" stroke-width="1.6" fill="rgba(139,47,217,0.10)"/>
        <g class="globe-rotate" opacity="0.6">
          <ellipse cx="20" cy="22" rx="10.4" ry="4.3" stroke="url(#fireGrad)" stroke-width="1"/>
          <ellipse cx="20" cy="22" rx="4.3" ry="10.4" stroke="url(#fireGrad)" stroke-width="1"/>
          <path d="M9.6 22H30.4" stroke="url(#fireGrad)" stroke-width="1"/>
        </g>

        <!-- flames wrapping the top and sides -->
        <use href="#flameShape" class="flame-path" transform="translate(20,4) scale(1.35)" style="animation-delay:0s;"/>
        <use href="#flameShape" class="flame-path" transform="translate(11,9) rotate(-32) scale(1.05)" style="animation-delay:0.4s;"/>
        <use href="#flameShape" class="flame-path" transform="translate(29,9) rotate(32) scale(1.05)" style="animation-delay:0.8s;"/>
        <use href="#flameShape" class="flame-path" transform="translate(5,17) rotate(-58) scale(0.85)" style="animation-delay:1.2s;" opacity="0.9"/>
        <use href="#flameShape" class="flame-path" transform="translate(35,17) rotate(58) scale(0.85)" style="animation-delay:1.6s;" opacity="0.9"/>

        <!-- embers rising off the flame -->
        <circle class="ember" cx="20" cy="3" r="1" fill="#FFB84D" style="animation-delay:0s;"/>
        <circle class="ember" cx="13" cy="6" r="0.8" fill="#FF3D68" style="animation-delay:0.6s;"/>
        <circle class="ember" cx="27" cy="5" r="0.9" fill="#FFB84D" style="animation-delay:1.1s;"/>
        <circle class="ember" cx="8" cy="12" r="0.7" fill="#FF3D68" style="animation-delay:1.7s;"/>
        <circle class="ember" cx="32" cy="12" r="0.7" fill="#8B2FD9" style="animation-delay:2.2s;"/>
      </svg>
      </div>
      <h1>SENTRY</h1>
    </div>
    <div class="chain-status">
      <div class="chip sol" id="solChip"><span class="dot"></span>SOLANA</div>
      <div class="chip rh" id="rhChip"><span class="dot"></span>ROBINHOOD</div>
    </div>
    <input class="search-box" id="search" placeholder="Search or paste an address…" />
    <div class="tabs" id="tabs">
      <div class="tab active" data-filter="all">All</div>
      <div class="tab" data-filter="solana">Pump.fun</div>
      <div class="tab" data-filter="robinhood">Robinhood</div>
      <div class="tab" data-filter="flagged">Flagged</div>
      <div class="tab" data-filter="clean">Clean</div>
    </div>
    <div class="token-list" id="tokenList"></div>
  </div>

  <div class="main" id="main">
    <div class="main-empty" id="mainEmpty">
      <div>Waiting for the first token to launch…</div>
      <div style="font-size:11px;">Select any token on the left once one appears</div>
    </div>
    <div class="detail" id="detail" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
  const tokenListEl = document.getElementById('tokenList');
  const listEmptyMsg = () => `<div class="list-empty">Nothing yet — Sentry is watching, this fills in as tokens launch.</div>`;
  const searchEl = document.getElementById('search');
  const solChip = document.getElementById('solChip');
  const rhChip = document.getElementById('rhChip');
  const toast = document.getElementById('toast');
  const tabsEl = document.getElementById('tabs');
  const mainEmpty = document.getElementById('mainEmpty');
  const detailEl = document.getElementById('detail');

  const tokensById = new Map();
  const rowEls = new Map();
  let solUsd = null;
  let activeFilter = 'all';
  let selectedId = null;
  let walletPubkey = null;
  let tradeSide = 'buy';

  function scoreClass(s) { return s >= 70 ? 'good' : s >= 40 ? 'warn' : 'bad'; }
  function short(addr) { return addr ? addr.slice(0, 5) + '…' + addr.slice(-5) : '—'; }

  function formatUsd(n) {
    if (n === null || n === undefined) return null;
    if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
    if (n >= 1_000) return '$' + (n / 1_000).toFixed(1) + 'K';
    return '$' + n.toFixed(0);
  }
  function formatPrice(n) {
    if (n === null || n === undefined) return null;
    if (n < 0.01) return '$' + n.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
    return '$' + n.toFixed(4);
  }
  function formatAge(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + (s % 60) + 's';
    const h = Math.floor(m / 60);
    return h + 'h ' + (m % 60) + 'm';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Address copied');
      if (btn) {
        const original = btn.textContent;
        btn.textContent = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
      }
    }).catch(() => showToast('Copy failed — select manually'));
  }

  function tradeLinks(token) {
    if (token.chain === 'robinhood') {
      return [{ label: 'View on Explorer ↗', url: `https://robinhoodchain.blockscout.com/address/${token.id}`, cls: 'primary rh' }];
    }
    return [
      { label: 'Trade on Pump.fun ↗', url: `https://pump.fun/coin/${token.id}`, cls: 'primary sol' },
      { label: 'Solscan ↗', url: `https://solscan.io/token/${token.id}`, cls: '' },
    ];
  }

  function mcapPieces(token) {
    const priceUsd = (token.priceSol !== null && solUsd) ? token.priceSol * solUsd : null;
    const mcapDisplay = token.marketCapUsd !== null && token.marketCapUsd !== undefined
      ? formatUsd(token.marketCapUsd)
      : (token.marketCapSol !== null && token.marketCapSol !== undefined
          ? token.marketCapSol.toFixed(2) + ' SOL'
          : (token.chain === 'robinhood' ? 'pending' : '—'));
    const priceDisplay = priceUsd !== null ? formatPrice(priceUsd)
      : (token.priceSol !== null && token.priceSol !== undefined ? token.priceSol.toFixed(8) + ' SOL' : '—');
    return { mcapDisplay, priceDisplay, initialOnly: token.marketCapIsInitialOnly === true };
  }

  // ---------------- token images (real, resolved from Pump.fun metadata) ----------------
  const imageCache = new Map(); // id -> resolved image URL, or 'failed'

  function avatarHtml(token, sizeCls) {
    const chainCls = token.chain === 'robinhood' ? 'rh' : 'sol';
    const initial = (token.symbol || '?').slice(0, 1).toUpperCase();
    const cached = imageCache.get(token.id);
    if (cached && cached !== 'failed') {
      return `<div class="avatar ${sizeCls || ''}"><img src="${cached}" alt="" onerror="this.parentElement.textContent='${initial}'"/></div>`;
    }
    return `<div class="avatar ${chainCls} ${sizeCls || ''}">${initial}</div>`;
  }

  async function resolveTokenImage(token) {
    if (!token.uri || imageCache.has(token.id)) return;
    imageCache.set(token.id, 'pending');
    try {
      const res = await fetch(token.uri);
      const meta = await res.json();
      if (meta.image) {
        imageCache.set(token.id, meta.image);
      } else {
        imageCache.set(token.id, 'failed');
      }
    } catch {
      imageCache.set(token.id, 'failed');
    }
    // Re-render wherever this token is currently showing, now that we
    // actually have (or definitively don't have) an image for it.
    const row = rowEls.get(token.id);
    if (row) row.replaceWith(renderRow(tokensById.get(token.id)));
    if (token.id === selectedId) renderDetail(tokensById.get(token.id));
  }

  // ---------------- sidebar rows ----------------
  function renderRow(token) {
    const chainCls = token.chain === 'robinhood' ? 'rh' : 'sol';
    const { mcapDisplay } = mcapPieces(token);
    const row = document.createElement('div');
    row.className = `token-row ${chainCls}` + (token.id === selectedId ? ' selected' : '');
    row.dataset.symbol = (token.symbol || '').toLowerCase();
    row.dataset.id = token.id.toLowerCase();
    row.dataset.chain = token.chain;
    row.dataset.flagged = (token.flags && token.flags.length) ? '1' : '0';
    row.innerHTML = `
      ${avatarHtml(token)}
      <div class="row-main">
        <div class="row-sym">${token.symbol || '???'}</div>
        <div class="row-sub">${chainCls === 'sol' ? 'Pump.fun' : 'Robinhood'} · ${short(token.id)}</div>
      </div>
      <div class="row-right">
        <div class="row-score ${scoreClass(token.score)}">${token.score}</div>
        <div class="row-mcap">${mcapDisplay}</div>
      </div>
    `;
    row.addEventListener('click', () => selectToken(token.id));
    return row;
  }

  function upsertToken(token) {
    tokensById.set(token.id, token);
    const existing = rowEls.get(token.id);
    const fresh = renderRow(token);
    if (existing) existing.replaceWith(fresh); else tokenListEl.prepend(fresh);
    rowEls.set(token.id, fresh);
    resolveTokenImage(token);

    const emptyNode = tokenListEl.querySelector('.list-empty');
    if (emptyNode) emptyNode.remove();

    if (!selectedId) selectToken(token.id);
    if (token.id === selectedId) renderDetail(token);

    applyFilter();
    trimList();
  }

  function trimList() {
    while (tokenListEl.children.length > 150) {
      const last = tokenListEl.lastElementChild;
      if (!last || last.classList.contains('list-empty')) break;
      const id = last.dataset.id;
      rowEls.delete(id);
      tokensById.delete(id);
      tokenListEl.removeChild(last);
    }
  }

  function selectToken(id) {
    selectedId = id;
    document.querySelectorAll('.token-row').forEach(r => r.classList.toggle('selected', r.dataset.id === id.toLowerCase()));
    const token = tokensById.get(id);
    if (token) renderDetail(token);
  }

  // ---------------- main detail panel ----------------
  function chartEmbedUrl(token) {
    if (token.chain !== 'solana') return null;
    return `https://dexscreener.com/solana/${token.id}?embed=1&theme=dark&trades=0&info=0`;
  }

  function renderDetail(token) {
    mainEmpty.style.display = 'none';
    detailEl.style.display = 'block';

    const chainCls = token.chain === 'robinhood' ? 'rh' : 'sol';
    const chainLabel = token.chain === 'robinhood' ? 'ROBINHOOD CHAIN' : 'PUMP.FUN · SOLANA';
    const { mcapDisplay, priceDisplay, initialOnly } = mcapPieces(token);
    const links = tradeLinks(token);
    const chartUrl = chartEmbedUrl(token);

    detailEl.innerHTML = `
      <div class="detail-head">
        <div style="display:flex; gap:14px; align-items:center;">
          ${avatarHtml(token, 'avatar-lg')}
          <div>
            <div class="detail-sym">${token.symbol || '???'} ${token.name ? `<span style="font-size:15px;color:var(--text-dim);font-weight:400;">${token.name}</span>` : ''}</div>
            <div class="detail-chain ${chainCls}">${chainLabel}</div>
          </div>
        </div>
        <div class="detail-score">
          <div class="num ${scoreClass(token.score)}">${token.score}</div>
          <div class="lbl">TRUST SCORE</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-cell"><div class="lbl">MARKET CAP${initialOnly ? ' (LAUNCH)' : ''}</div><div class="val">${mcapDisplay}</div></div>
        <div class="stat-cell"><div class="lbl">PRICE</div><div class="val" style="font-size:11.5px;">${priceDisplay}</div></div>
        <div class="stat-cell"><div class="lbl">AGE</div><div class="val age-val" data-created="${token.createdAt}">0s</div></div>
        <div class="stat-cell"><div class="lbl">CREATOR</div><div class="val" style="font-size:11px;">${short(token.creator)}</div></div>
      </div>

      <div class="chart-wrap">
        ${chartUrl
          ? `<iframe src="${chartUrl}" loading="lazy"></iframe>`
          : `<div class="chart-fallback">No embedded chart for Robinhood Chain yet — use the explorer link below to inspect this token directly.</div>`}
      </div>

      <div class="section">
        <h3>Why this score</h3>
        <div class="flag-list">
          ${(token.flags && token.flags.length)
            ? token.flags.map(f => `<div class="flag-item">⚠ ${f}</div>`).join('')
            : `<div class="flag-item ok">✓ No red flags detected. Not a guarantee of safety — just nothing suspicious has shown up in what Sentry can currently observe.</div>`}
        </div>
      </div>

      <div class="section">
        <h3>Contract</h3>
        <div class="addr-row"><span style="flex:1;">${token.id}</span><button class="copy-btn" id="detailCopyBtn">Copy</button></div>
        <div class="action-row">
          ${links.map(l => `<a class="action-btn ${l.cls}" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')}
        </div>
      </div>

      ${token.chain === 'solana' ? `
        <div class="section">
          <h3>Trade (beta)</h3>
          <div class="trade-panel">
            <div class="trade-warning">⚠ Beta — test with a small amount first. Sentry never sees your private key; your wallet signs every transaction. If a platform fee applies, it's included as a visible line in the same transaction you sign — never a separate or hidden charge.</div>
            <div id="walletArea"></div>
          </div>
        </div>
      ` : `
        <div class="section">
          <h3>Trade</h3>
          <div class="trade-panel">
            <div style="font-size:11.5px;color:var(--text-dim);">In-app trading for Robinhood Chain isn't wired up yet — use the explorer link above for now.</div>
          </div>
        </div>
      `}
    `;

    detailEl.querySelector('#detailCopyBtn').addEventListener('click', (e) => copyText(token.id, e.target));
    if (token.chain === 'solana') renderWalletArea(token);
  }

  // ---------------- category tabs + search ----------------
  tabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeFilter = tab.dataset.filter;
    applyFilter();
  });

  function passesTab(row) {
    switch (activeFilter) {
      case 'solana': return row.dataset.chain === 'solana';
      case 'robinhood': return row.dataset.chain === 'robinhood';
      case 'flagged': return row.dataset.flagged === '1';
      case 'clean': return row.dataset.flagged === '0';
      default: return true;
    }
  }

  function detectChainFromAddress(addr) {
    if (/^0x[a-fA-F0-9]{40}$/.test(addr)) return 'robinhood';
    if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(addr)) return 'solana';
    return null;
  }

  let lookupDebounce = null;

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    let anyRow = false;
    [...tokenListEl.children].forEach(r => {
      if (!r.dataset) return; // skip the empty-state div
      const searchOk = !q || r.dataset.symbol.includes(q) || r.dataset.id.includes(q);
      const visible = searchOk && passesTab(r);
      r.style.display = visible ? '' : 'none';
      if (visible) anyRow = true;
    });

    if (!anyRow && q.length >= 20) {
      clearTimeout(lookupDebounce);
      lookupDebounce = setTimeout(() => runServerLookup(searchEl.value.trim()), 400);
    }
  }

  async function runServerLookup(raw) {
    const chain = detectChainFromAddress(raw);
    if (!chain) return;
    try {
      const res = await fetch('/api/lookup?address=' + encodeURIComponent(raw));
      const data = await res.json();
      if (data.found && data.source === 'live-history') {
        upsertToken(data.token);
        selectToken(data.token.id);
        return;
      }
      if (data.found && data.source === 'on-chain-direct') {
        mainEmpty.style.display = 'none';
        detailEl.style.display = 'block';
        const links = tradeLinks({ id: raw, chain: data.chain });
        let facts = '';
        if (data.chain === 'solana') {
          facts = `<div style="font-size:11.5px;line-height:1.8;"><div><b>Supply:</b> ${data.supply ?? '—'}</div><div><b>Decimals:</b> ${data.decimals ?? '—'}</div><div><b>Mint authority:</b> ${data.mintAuthority ? short(data.mintAuthority) : 'renounced / none'}</div></div>`;
        } else if (data.name || data.symbol) {
          facts = `<div style="font-size:12.5px;"><b>${data.symbol || '?'}</b> — ${data.name || 'unknown name'}</div>`;
        }
        detailEl.innerHTML = `
          <div class="section">
            <h3>Confirmed on-chain — not in Sentry's live history</h3>
            <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Launched before Sentry started watching, or on a launchpad it doesn't track yet — so no score or flags, just what's verifiable directly from the chain.</div>
            ${facts}
            <div class="action-row" style="margin-top:14px;">
              ${links.map(l => `<a class="action-btn ${l.cls}" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')}
            </div>
          </div>`;
        return;
      }
      mainEmpty.style.display = 'none';
      detailEl.style.display = 'block';
      detailEl.innerHTML = `<div class="section"><h3>Nothing found</h3><div style="font-size:12.5px;color:var(--text-dim);">${data.reason || "That address doesn't resolve to a token Sentry can verify."}</div></div>`;
    } catch {
      showToast('Lookup failed — try again');
    }
  }

  searchEl.addEventListener('input', applyFilter);

  // ---------------- wallet connect + trade (Solana only, non-custodial) ----------------
  function base64ToBytes(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function connectPhantom() {
    if (!window.solana || !window.solana.isPhantom) {
      showToast('Phantom wallet not detected — install the extension first');
      return null;
    }
    try {
      const resp = await window.solana.connect();
      walletPubkey = resp.publicKey.toString();
      return walletPubkey;
    } catch {
      showToast('Wallet connection cancelled');
      return null;
    }
  }

  function renderWalletArea(token) {
    const area = document.getElementById('walletArea');
    if (!area) return;

    if (!walletPubkey) {
      area.innerHTML = `<button class="connect-btn" id="connectBtn">Connect Phantom Wallet</button>`;
      area.querySelector('#connectBtn').addEventListener('click', async () => {
        const pk = await connectPhantom();
        if (pk) renderWalletArea(token);
      });
      return;
    }

    area.innerHTML = `
      <div class="wallet-pill"><span>${short(walletPubkey)}</span><span style="color:var(--text-faint);">connected</span></div>
      <div class="side-toggle">
        <button class="side-btn buy ${tradeSide === 'buy' ? 'active buy' : ''}" id="buyToggle">Buy</button>
        <button class="side-btn sell ${tradeSide === 'sell' ? 'active sell' : ''}" id="sellToggle">Sell</button>
      </div>
      <input class="amount-input" id="tradeAmount" type="number" step="any" min="0" placeholder="${tradeSide === 'buy' ? 'Amount in SOL' : 'Amount of tokens'}" />
      <button class="execute-btn ${tradeSide}" id="executeBtn">${tradeSide === 'buy' ? 'Buy' : 'Sell'} ${token.symbol || ''}</button>
      <div id="tradeStatusArea"></div>
    `;
    area.querySelector('#buyToggle').addEventListener('click', () => { tradeSide = 'buy'; renderWalletArea(token); });
    area.querySelector('#sellToggle').addEventListener('click', () => { tradeSide = 'sell'; renderWalletArea(token); });
    area.querySelector('#executeBtn').addEventListener('click', () => executeTrade(token));
  }

  function setTradeStatus(msg, kind) {
    const el = document.getElementById('tradeStatusArea');
    if (!el) return;
    el.innerHTML = `<div class="trade-status ${kind}">${msg}</div>`;
  }

  async function executeTrade(token) {
    const amountInput = document.getElementById('tradeAmount');
    const amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) { setTradeStatus('Enter a valid amount first.', 'error'); return; }

    const executeBtn = document.getElementById('executeBtn');
    executeBtn.disabled = true;
    setTradeStatus('Building transaction…', 'pending');

    try {
      const buildRes = await fetch('/api/trade/solana-build', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          publicKey: walletPubkey, action: tradeSide, mint: token.id, amount,
          denominatedInSol: tradeSide === 'buy', slippage: 10,
        }),
      });
      const buildData = await buildRes.json();
      if (!buildRes.ok || !buildData.transaction) throw new Error(buildData.error || 'Failed to build transaction');

      if (buildData.feeApplied) {
        setTradeStatus(`Includes a ${(buildData.feeBps / 100).toFixed(2)}% platform fee, part of this same transaction. Confirm in Phantom…`, 'pending');
      } else {
        setTradeStatus('Confirm the transaction in Phantom…', 'pending');
      }

      const txBytes = base64ToBytes(buildData.transaction);
      const tx = solanaWeb3.VersionedTransaction.deserialize(txBytes);
      const { signature } = await window.solana.signAndSendTransaction(tx);

      setTradeStatus(`Sent. <a href="https://solscan.io/tx/${signature}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">View on Solscan ↗</a>`, 'success');
    } catch (err) {
      setTradeStatus('Failed: ' + (err.message || 'unknown error'), 'error');
    } finally {
      executeBtn.disabled = false;
    }
  }

  // ---------------- websocket ----------------
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/live`);

    ws.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.type === 'snapshot') {
        if (data.tokens.length === 0) tokenListEl.innerHTML = listEmptyMsg();
        data.tokens.forEach(upsertToken);
      }
      if (data.type === 'token' || data.type === 'update') upsertToken(data.token);
      if (data.type === 'feedStatus') {
        const chip = data.chain === 'robinhood' ? rhChip : solChip;
        chip.classList.toggle('live', data.status === 'connected');
      }
      if (data.type === 'solPrice') solUsd = data.usd;
    };

    ws.onclose = () => {
      solChip.classList.remove('live');
      rhChip.classList.remove('live');
      setTimeout(connect, 2000);
    };
  }
  tokenListEl.innerHTML = listEmptyMsg();
  connect();

  setInterval(() => {
    document.querySelectorAll('.age-val').forEach(el => {
      const created = Number(el.dataset.created);
      if (created) el.textContent = formatAge(Date.now() - created);
    });
  }, 1000);
</script>
</body>
</html>
