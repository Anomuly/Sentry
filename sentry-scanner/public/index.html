<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentry</title>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>
  :root {
    --bg: #0A050C; --surface: #150A12; --surface-2: #1E0F1A; --surface-3: #281424;
    --line: #3A1B2C; --line-soft: #2A1220;
    --text: #F6E9EF; --text-dim: #B08696; --text-faint: #6E4351;
    --up: #00E5A0; --down: #FF2D4E; --amber: #FFB84D;
    --accent: #FF3D68; --accent-2: #8B2FD9; --gold: #FFD166;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --disp: -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  button { font-family: inherit; cursor: pointer; }

  .topbar {
    height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 18px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  #globeCanvas { display: block; filter: drop-shadow(0 0 12px rgba(255,61,104,0.45)); }
  .brand h1 {
    font-family: var(--disp); font-weight: 900; font-size: 22px; margin: 0;
    letter-spacing: 0.16em; text-transform: uppercase;
    background: linear-gradient(180deg, #FFF0C4 0%, var(--gold) 30%, var(--accent) 68%, var(--accent-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,61,104,0.45)); line-height: 1;
  }
  .topsearch { flex: 1; max-width: 620px; margin: 0 auto; position: relative; }
  .topsearch input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 12px 9px 34px; color: var(--text);
    font-family: var(--mono); font-size: 12.5px; outline: none;
  }
  .topsearch input:focus { border-color: var(--accent); }
  .topsearch input::placeholder { color: var(--text-faint); }
  .topsearch .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
  .chainchips { display: flex; gap: 7px; flex-shrink: 0; }
  .chip {
    display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.05em; padding: 5px 9px 5px 7px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text-faint);
  }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); }
  .chip.live { color: var(--up); }
  .chip.live .dot { background: var(--up); box-shadow: 0 0 6px var(--up); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .shell { display: flex; height: calc(100vh - 56px); }

  .sidebar {
    width: 290px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--surface);
  }
  .side-tabs { display: flex; gap: 2px; padding: 10px 12px 0; }
  .side-tab {
    font-family: var(--disp); font-weight: 700; font-size: 11.5px; padding: 6px 9px;
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-faint);
  }
  .side-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .pills { display: flex; gap: 5px; padding: 10px 12px; overflow-x: auto; }
  .pill {
    flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 4px 9px;
    border-radius: 100px; white-space: nowrap; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text-faint);
  }
  .pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .pill .n { opacity: 0.65; margin-left: 3px; }

  .tokenlist { flex: 1; overflow-y: auto; border-top: 1px solid var(--line-soft); }
  .trow {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border-bottom: 1px solid var(--line-soft); cursor: pointer; position: relative;
  }
  .trow:hover, .trow.sel { background: var(--surface-2); }
  .trow.sel::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background: var(--accent); }
  .av {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--disp); font-weight: 800; font-size: 12px; color: #fff;
  }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av.lg { width: 40px; height: 40px; font-size: 16px; }
  .tmain { flex: 1; min-width: 0; }
  .tsym { font-family: var(--disp); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 5px; }
  .tage { font-size: 9px; color: var(--text-faint); font-weight: 400; }
  .tvol { font-size: 9.5px; color: var(--text-faint); margin-top: 1px; }
  .tright { text-align: right; flex-shrink: 0; }
  .tmc { font-family: var(--disp); font-weight: 700; font-size: 12px; }
  .tscore { font-size: 9.5px; margin-top: 1px; font-weight: 700; }
  .up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--amber); }
  .badge-hp {
    font-size: 7.5px; font-weight: 800; padding: 1px 4px; border-radius: 3px;
    background: var(--down); color: #fff; margin-left: 4px;
  }
  .list-empty { padding: 34px 18px; text-align: center; color: var(--text-faint); font-size: 11px; line-height: 1.7; }

  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-faint); gap: 6px; font-size: 12.5px;
  }
  .coinhead { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .coinid { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .coinsym { font-family: var(--disp); font-weight: 800; font-size: 17px; line-height: 1.1; }
  .coinsub { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  .addrpill {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 7px; font-size: 10px; color: var(--text-dim);
  }
  .addrpill button { background: none; border: none; color: var(--text-faint); font-size: 10px; padding: 0; }
  .statrow { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; min-width: 74px; }
  .stat .k { font-size: 8.5px; color: var(--text-faint); }
  .stat .v { font-family: var(--disp); font-weight: 700; font-size: 12.5px; margin-top: 1px; }

  .charttools { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tfs { display: flex; gap: 3px; }
  .tf { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-faint); }
  .tf.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ohlc { font-size: 10px; color: var(--text-faint); display: flex; gap: 10px; flex-wrap: wrap; }
  .ohlc b { color: var(--text); font-weight: 600; }
  .chartbox { flex: 1; position: relative; min-height: 200px; }
  #chart { width: 100%; height: 100%; display: block; }
  .chartmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; color: var(--text-faint); font-size: 11.5px; line-height: 1.7; }
  .ttip { position: absolute; pointer-events: none; z-index: 6; background: rgba(10,5,12,0.96); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 10px; line-height: 1.6; white-space: nowrap; opacity: 0; transition: opacity .1s; }
  .ttip.show { opacity: 1; }
  #chart { cursor: crosshair; }
  #chart.grabbing { cursor: grabbing; }
  .chartbtns { display: flex; gap: 4px; margin-left: auto; }
  .cbtn {
    font-size: 9.5px; font-weight: 700; padding: 4px 8px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text-faint);
  }
  .cbtn:hover { color: var(--text); border-color: var(--accent); }
  .cbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .charthint {
    position: absolute; bottom: 6px; left: 10px; font-size: 9px;
    color: var(--text-faint); opacity: 0.7; pointer-events: none;
  }

  .btmpanel { height: 190px; flex-shrink: 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  .btmtabs { display: flex; gap: 2px; padding: 6px 14px 0; border-bottom: 1px solid var(--line-soft); }
  .btmtab { font-family: var(--disp); font-weight: 700; font-size: 10.5px; padding: 5px 9px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-faint); }
  .btmtab.active { color: var(--text); border-bottom-color: var(--accent); }
  .btmbody { flex: 1; overflow-y: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  table.data th { text-align: left; padding: 6px 14px; color: var(--text-faint); font-weight: 500; font-size: 9px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
  table.data td { padding: 6px 14px; border-bottom: 1px solid var(--line-soft); }
  table.data tr:hover td { background: var(--surface-2); }
  .bar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; min-width: 50px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .panel-note { padding: 22px 16px; color: var(--text-faint); font-size: 11px; line-height: 1.7; text-align: center; }

  .right { width: 280px; flex-shrink: 0; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; }
  .bs { display: flex; padding: 12px 12px 0; }
  .bs button { flex: 1; padding: 9px; font-family: var(--disp); font-weight: 800; font-size: 13px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-faint); }
  .bs button:first-child { border-radius: 8px 0 0 8px; }
  .bs button:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .bs button.on.buy { background: var(--up); color: #04140D; border-color: var(--up); }
  .bs button.on.sell { background: var(--down); color: #fff; border-color: var(--down); }
  .amt { padding: 12px; }
  .amt input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; color: var(--text); font-family: var(--disp); font-weight: 700; font-size: 20px; outline: none; }
  .amt input:focus { border-color: var(--accent); }
  .quick { display: flex; gap: 5px; margin-top: 8px; }
  .quick button { flex: 1; padding: 6px 0; font-size: 10.5px; font-weight: 700; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-dim); }
  .quick button:hover { color: var(--text); border-color: var(--accent); }
  .exec { width: calc(100% - 24px); margin: 0 12px 10px; padding: 12px; border-radius: 9px; border: none; font-family: var(--disp); font-weight: 800; font-size: 14px; }
  .exec.buy { background: var(--up); color: #04140D; }
  .exec.sell { background: var(--down); color: #fff; }
  .exec:disabled, .amt input:disabled, .quick button:disabled { opacity: 0.45; cursor: not-allowed; }
  .tstat { margin: 0 12px 10px; font-size: 10.5px; padding: 8px 10px; border-radius: 7px; }
  .tstat.pending { background: rgba(139,47,217,0.14); color: #D5B4FF; }
  .tstat.success { background: rgba(0,229,160,0.12); color: var(--up); }
  .tstat.error { background: rgba(255,45,78,0.12); color: var(--down); }
  .warnbox { margin: 0 12px 12px; font-size: 10px; line-height: 1.6; color: var(--amber); background: rgba(255,184,77,0.08); border: 1px solid rgba(255,184,77,0.22); border-radius: 7px; padding: 8px 10px; }
  .rsec { padding: 12px; border-top: 1px solid var(--line-soft); }
  .rsec h4 { font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 9px; font-weight: 600; }
  .flagrow { font-size: 10.5px; line-height: 1.5; padding: 8px 9px; border-radius: 6px; margin-bottom: 6px; background: rgba(255,45,78,0.09); border: 1px solid rgba(255,45,78,0.2); }
  .flagrow.ok { background: rgba(0,229,160,0.08); border-color: rgba(0,229,160,0.2); }
  .flagrow.crit { background: rgba(255,45,78,0.2); border-color: var(--down); font-weight: 600; box-shadow: 0 0 12px rgba(255,45,78,0.22); }
  .flagrow.crit::before { content: '🛑 '; }
  .connectbtn { width: calc(100% - 24px); margin: 0 12px 12px; padding: 12px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; font-family: var(--disp); font-weight: 800; font-size: 13px; }
  .wpill { margin: 0 12px 10px; font-size: 10px; color: var(--up); display: flex; justify-content: space-between; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(18px); background: var(--surface-3); border: 1px solid var(--up); color: var(--up); padding: 9px 16px; border-radius: 100px; font-size: 11.5px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 90; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1180px) { .right, .sidebar { width: 240px; } }
  @media (max-width: 900px) {
    html, body { overflow: auto; }
    .shell { flex-direction: column; height: auto; }
    .sidebar { width: 100%; height: 300px; border-right: none; border-bottom: 1px solid var(--line); }
    .right { width: 100%; border-left: none; border-top: 1px solid var(--line); }
    .chartbox { height: 300px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <canvas id="globeCanvas"></canvas>
    <h1>Sentry</h1>
  </div>
  <div class="topsearch">
    <span class="ico">&#9906;</span>
    <input id="search" placeholder="Search tokens or paste a contract address…" />
  </div>
  <div class="chainchips">
    <div class="chip" id="solChip"><span class="dot"></span>SOLANA</div>
    <div class="chip" id="rhChip"><span class="dot"></span>ROBINHOOD</div>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="side-tabs"><button class="side-tab active">Tokens</button></div>
    <div class="pills" id="pills">
      <button class="pill active" data-f="all">Live<span class="n" data-c="all">0</span></button>
      <button class="pill" data-f="flagged">Rug Watch<span class="n" data-c="flagged">0</span></button>
      <button class="pill" data-f="critical">Honeypot<span class="n" data-c="critical">0</span></button>
      <button class="pill" data-f="clean">Clean<span class="n" data-c="clean">0</span></button>
      <button class="pill" data-f="solana">Pump<span class="n" data-c="solana">0</span></button>
      <button class="pill" data-f="robinhood">RH<span class="n" data-c="robinhood">0</span></button>
    </div>
    <div class="tokenlist" id="tokenlist"></div>
  </div>

  <div class="center">
    <div class="empty-state" id="emptyState">
      <div>Waiting for the first launch…</div>
      <div style="font-size:11px;">Select a token from the list to open its terminal</div>
    </div>
    <div id="coinView" style="display:none; flex-direction:column; flex:1; min-height:0;">
      <div class="coinhead" id="coinhead"></div>
      <div class="charttools">
        <div class="tfs" id="tfs">
          <button class="tf active" data-tf="minute" data-agg="1">1m</button>
          <button class="tf" data-tf="minute" data-agg="5">5m</button>
          <button class="tf" data-tf="minute" data-agg="15">15m</button>
          <button class="tf" data-tf="hour" data-agg="1">1H</button>
          <button class="tf" data-tf="hour" data-agg="4">4H</button>
          <button class="tf" data-tf="day" data-agg="1">1D</button>
        </div>
        <div class="ohlc" id="ohlc"></div>
        <div class="chartbtns">
          <button class="cbtn" id="btnZoomOut" title="Zoom out">−</button>
          <button class="cbtn" id="btnZoomIn" title="Zoom in">+</button>
          <button class="cbtn" id="btnFit" title="Fit all candles">Fit</button>
          <button class="cbtn on" id="btnFollow" title="Auto-scroll to newest candle">Live</button>
        </div>
      </div>
      <div class="chartbox">
        <canvas id="chart"></canvas>
        <div class="ttip" id="ttip"></div>
        <div class="chartmsg" id="chartmsg">Loading chart…</div>
        <div class="charthint">scroll to zoom · drag to pan</div>
      </div>
      <div class="btmpanel">
        <div class="btmtabs" id="btmtabs">
          <button class="btmtab active" data-p="holders">Holders</button>
          <button class="btmtab" data-p="risk">Risk Report</button>
          <button class="btmtab" data-p="activity">Activity</button>
        </div>
        <div class="btmbody" id="btmbody"></div>
      </div>
    </div>
  </div>

  <div class="right" id="right">
    <div class="panel-note">Select a token to trade.</div>
  </div>
</div>

<div class="toast" id="toast">Copied</div>

<script type="module">
  import { mountGlobe } from './globe.js';
  mountGlobe(document.getElementById('globeCanvas'), 46);
</script>

<script>
const tokenlist = document.getElementById('tokenlist');
const searchEl = document.getElementById('search');
const solChip = document.getElementById('solChip');
const rhChip = document.getElementById('rhChip');
const toast = document.getElementById('toast');
const pills = document.getElementById('pills');
const emptyState = document.getElementById('emptyState');
const coinView = document.getElementById('coinView');
const coinhead = document.getElementById('coinhead');
const rightPanel = document.getElementById('right');
const btmtabs = document.getElementById('btmtabs');
const btmbody = document.getElementById('btmbody');

const tokens = new Map();
const rows = new Map();
const imageCache = new Map();
let solUsd = null, filter = 'all', selectedId = null;
let walletPubkey = null, side = 'buy', btmPanel = 'holders';
let chartState = { tf: 'minute', agg: 1, candles: [], token: null };
let chartFetchId = 0;

const scoreCls = s => s >= 70 ? 'up' : s >= 40 ? 'warn' : 'down';
const short = a => a ? a.slice(0,4) + '…' + a.slice(-4) : '—';
const isCritical = f => /HONEYPOT RISK|Mint authority not renounced/i.test(f);
const hasCritical = t => (t.flags || []).some(isCritical);

function fmtUsd(n){ if(n==null) return '—'; if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M'; if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(0); }
function fmtPrice(n){ if(n==null) return '—'; if(n>=1) return '$'+n.toFixed(3); if(n>=0.0001) return '$'+n.toFixed(6); return '$'+n.toExponential(2); }
function fmtVol(n){ if(n>=1e6) return '$'+(n/1e6).toFixed(1)+'M'; if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(0); }
function fmtAge(ms){ const s=Math.max(0,Math.floor(ms/1000)); if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'m'; const h=Math.floor(m/60); if(h<24) return h+'h'; return Math.floor(h/24)+'d'; }
function showToast(m){ toast.textContent=m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1400); }
function copyText(t,btn){ navigator.clipboard.writeText(t).then(()=>{ showToast('Address copied'); if(btn){const o=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=o,1100);} }).catch(()=>showToast('Copy failed')); }
function mcapOf(t){ if(t.marketCapUsd!=null) return t.marketCapUsd; if(t.marketCapSol!=null&&solUsd) return t.marketCapSol*solUsd; return null; }

function avatar(t, cls){
  const init=(t.symbol||'?').slice(0,1).toUpperCase();
  const cached=imageCache.get(t.id);
  const src=t.iconUrl||(cached&&cached!=='failed'&&cached!=='pending'?cached:null);
  if(src) return `<div class="av ${cls||''}"><img src="${src}" onerror="this.parentElement.textContent='${init}'"/></div>`;
  return `<div class="av ${cls||''}">${init}</div>`;
}
async function resolveImage(t){
  if(!t.uri||imageCache.has(t.id)) return;
  imageCache.set(t.id,'pending');
  try{ const r=await fetch(t.uri); const m=await r.json(); imageCache.set(t.id, m.image||'failed'); }
  catch{ imageCache.set(t.id,'failed'); }
  const row=rows.get(t.id);
  if(row) row.replaceWith(renderRow(tokens.get(t.id)));
  if(t.id===selectedId) renderCoinHead(tokens.get(t.id));
}

function renderRow(t){
  const mc=mcapOf(t);
  const el=document.createElement('div');
  el.className='trow'+(t.id===selectedId?' sel':'');
  el.dataset.id=t.id.toLowerCase();
  el.dataset.sym=(t.symbol||'').toLowerCase();
  el.dataset.chain=t.chain;
  el.dataset.flagged=(t.flags&&t.flags.length)?'1':'0';
  el.dataset.crit=hasCritical(t)?'1':'0';
  el.innerHTML=`${avatar(t)}
    <div class="tmain">
      <div class="tsym">${t.symbol||'???'}<span class="tage" data-created="${t.createdAt}">0s</span>${hasCritical(t)?'<span class="badge-hp">HONEYPOT</span>':''}</div>
      <div class="tvol">${t.chain==='solana'?'Pump.fun':'Robinhood'}</div>
    </div>
    <div class="tright">
      <div class="tmc">${mc!=null?fmtUsd(mc):'—'}</div>
      <div class="tscore ${scoreCls(t.score)}">${t.score}</div>
    </div>`;
  el.addEventListener('click',()=>select(t.id));
  return el;
}

function upsert(t){
  tokens.set(t.id,t);
  const ex=rows.get(t.id); const fresh=renderRow(t);
  if(ex) ex.replaceWith(fresh); else tokenlist.prepend(fresh);
  rows.set(t.id,fresh); resolveImage(t);
  const e=tokenlist.querySelector('.list-empty'); if(e) e.remove();
  if(!selectedId) select(t.id);
  else if(t.id===selectedId){ renderCoinHead(t); renderRight(t); renderBtm(t); }
  applyFilter();
  while(tokenlist.children.length>150){
    const last=tokenlist.lastElementChild;
    if(!last||!last.dataset.id) break;
    rows.delete(last.dataset.id); tokens.delete(last.dataset.id); last.remove();
  }
}

function select(id){
  selectedId=id;
  document.querySelectorAll('.trow').forEach(r=>r.classList.toggle('sel',r.dataset.id===id.toLowerCase()));
  const t=tokens.get(id); if(!t) return;
  emptyState.style.display='none';
  coinView.style.display='flex';
  renderCoinHead(t); renderRight(t); renderBtm(t); wireChart(t); loadChart(t);
}

pills.addEventListener('click',e=>{

function passes(r){
  switch(filter){
    case 'flagged': return r.dataset.flagged==='1';
    case 'critical': return r.dataset.crit==='1';
    case 'clean': return r.dataset.flagged==='0';
    case 'solana': return r.dataset.chain==='solana';
    case 'robinhood': return r.dataset.chain==='robinhood';
    default: return true;
  }
}

function applyFilter(){
  const q=searchEl.value.trim().toLowerCase();
  let any=false;
  const c={all:0,flagged:0,critical:0,clean:0,solana:0,robinhood:0};
  [...tokenlist.children].forEach(r=>{
    if(!r.dataset||!r.dataset.id) return;
    c.all++;
    if(r.dataset.flagged==='1') c.flagged++; else c.clean++;
    if(r.dataset.crit==='1') c.critical++;
    if(r.dataset.chain==='solana') c.solana++; else c.robinhood++;
    const ok=(!q||r.dataset.sym.includes(q)||r.dataset.id.includes(q))&&passes(r);
    r.style.display=ok?'':'none';
    if(ok) any=true;
  });
  Object.entries(c).forEach(([k,v])=>{ const el=pills.querySelector(`[data-c="${k}"]`); if(el) el.textContent=v; });
  if(!any&&q.length>=20){ clearTimeout(window._lk); window._lk=setTimeout(()=>serverLookup(searchEl.value.trim()),400); }
}
searchEl.addEventListener('input',applyFilter);

async function serverLookup(raw){
  try{
    const r=await fetch('/api/lookup?address='+encodeURIComponent(raw));
    const d=await r.json();
    if(d.found&&d.source==='live-history'){ upsert(d.token); select(d.token.id); return; }
    showToast(d.found?'Found on-chain, not in live feed':(d.reason||'Not found'));
  }catch{ showToast('Lookup failed'); }
}

async function loadChart(t){
  if(!chartState.token || chartState.token.id !== t.id) chartState.resetView = true;
  chartState.token=t;
  const id=++chartFetchId;
  const msg=document.getElementById('chartmsg'), ohlc=document.getElementById('ohlc');
  if(msg){ msg.style.display='flex'; msg.textContent='Loading chart…'; }
  if(ohlc) ohlc.innerHTML='';
  try{
    const r=await fetch(`/api/chart?address=${encodeURIComponent(t.id)}&chain=${t.chain}&timeframe=${chartState.tf}&aggregate=${chartState.agg}`);
    const d=await r.json();
    if(id!==chartFetchId) return;
    const prevLen = chartState.candles.length;
    chartState.candles=d.candles||[];
    // Preserve the user's zoom/pan across refreshes. Only reset the
    // viewport when switching token/timeframe, not when new candles
    // stream in — otherwise zooming in would be undone every 30s.
    if(chartState.resetView || !prevLen){
      view.count = chartState.candles.length;
      view.start = 0;
      setFollow(true);
      chartState.resetView = false;
    }
    bindChartInteraction();
    if(!chartState.candles.length){
      if(msg){ msg.style.display='flex'; msg.textContent=d.reason||'No chart data yet.'; }
      const cv=document.getElementById('chart'); if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
      return;
    }
    if(msg) msg.style.display='none';
    drawChart();
  }catch{
    if(id!==chartFetchId) return;
    if(msg){ msg.style.display='flex'; msg.textContent='Chart failed to load.'; }
  }
}

// ---- interactive chart state ----
// view.start = index of leftmost visible candle (float, allows smooth pan)
// view.count = how many candles fit in the viewport (zoom level)
// follow = keep pinned to the newest candle as data streams in
let view = { start: 0, count: 0, follow: true };
let cross = { x: null, y: null, active: false };
let drag = { on: false, x0: 0, start0: 0 };
const MIN_CANDLES = 8;   // hard zoom-in limit
const PAD = { L: 10, R: 64, T: 10, B: 20 };

function chartGeom(cv) {
  const box = cv.parentElement;
  return { W: box.clientWidth, H: box.clientHeight };
}

function clampView() {
  const n = chartState.candles.length;
  if (!n) return;
  view.count = Math.max(MIN_CANDLES, Math.min(n, view.count || n));
  view.start = Math.max(0, Math.min(n - view.count, view.start));
}

function visibleSlice() {
  clampView();
  const s = Math.floor(view.start);
  return { s, e: Math.min(chartState.candles.length, s + Math.ceil(view.count)) };
}

function drawChart() {
  const cv = document.getElementById('chart');
  if (!cv || !chartState.candles.length) return;

  const dpr = window.devicePixelRatio || 1;
  const { W, H } = chartGeom(cv);
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const all = chartState.candles;
  if (!view.count) view.count = all.length;
  if (view.follow) view.start = Math.max(0, all.length - view.count);
  clampView();

  const { s, e } = visibleSlice();
  const k = all.slice(s, e);
  if (!k.length) return;

  const volH = Math.round(H * 0.2);
  const priceH = H - PAD.T - PAD.B - volH - 8;
  let hi = Math.max(...k.map(c => c.h)), lo = Math.min(...k.map(c => c.l));
  if (hi === lo) { hi *= 1.02; lo *= 0.98; }
  const pd = (hi - lo) * 0.08; hi += pd; lo -= pd;
  const maxV = Math.max(...k.map(c => c.v), 1);

  const plotW = W - PAD.L - PAD.R;
  const step = plotW / view.count;
  const bw = Math.max(1, Math.min(14, step * 0.62));
  const yP = p => PAD.T + (1 - (p - lo) / (hi - lo)) * priceH;
  const yV = v => PAD.T + priceH + 8 + volH - (v / maxV) * volH;
  const xAt = i => PAD.L + (i - view.start) * step + step / 2;

  g.font = '9.5px ui-monospace, monospace';
  g.textBaseline = 'middle';

  // price grid + axis
  for (let i = 0; i <= 4; i++) {
    const p = lo + (hi - lo) * (i / 4), y = yP(p);
    g.strokeStyle = 'rgba(255,255,255,0.045)';
    g.beginPath(); g.moveTo(PAD.L, y); g.lineTo(W - PAD.R, y); g.stroke();
    g.fillStyle = '#6E4351'; g.fillText(fmtPrice(p), W - PAD.R + 6, y);
  }

  // time axis (a few evenly spaced labels)
  const ticks = Math.max(2, Math.min(6, Math.floor(plotW / 90)));
  g.textAlign = 'center';
  for (let i = 0; i <= ticks; i++) {
    const idx = Math.floor(view.start + (view.count - 1) * (i / ticks));
    const c = all[Math.max(0, Math.min(all.length - 1, idx))];
    if (!c) continue;
    const x = xAt(idx);
    if (x < PAD.L || x > W - PAD.R) continue;
    const d = new Date(c.t * 1000);
    g.fillStyle = '#6E4351';
    g.fillText(d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'), x, H - 9);
  }
  g.textAlign = 'left';

  // volume
  k.forEach((c, i) => {
    const gi = s + i;
    const x = xAt(gi) - bw / 2;
    if (x + bw < PAD.L || x > W - PAD.R) return;
    g.fillStyle = c.c >= c.o ? 'rgba(0,229,160,0.32)' : 'rgba(255,45,78,0.32)';
    const y = yV(c.v);
    g.fillRect(x, y, bw, (PAD.T + priceH + 8 + volH) - y);
  });

  // candles
  k.forEach((c, i) => {
    const gi = s + i;
    const xc = xAt(gi);
    if (xc < PAD.L - bw || xc > W - PAD.R + bw) return;
    const x = xc - bw / 2, up = c.c >= c.o;
    const col = up ? '#00E5A0' : '#FF2D4E';
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1;
    g.beginPath(); g.moveTo(xc, yP(c.h)); g.lineTo(xc, yP(c.l)); g.stroke();
    const yo = yP(c.o), yc2 = yP(c.c);
    g.fillRect(x, Math.min(yo, yc2), bw, Math.max(1, Math.abs(yc2 - yo)));
  });

  // volume divider + label
  g.strokeStyle = 'rgba(255,255,255,0.06)';
  g.beginPath(); g.moveTo(PAD.L, PAD.T + priceH + 4); g.lineTo(W - PAD.R, PAD.T + priceH + 4); g.stroke();
  g.fillStyle = '#6E4351'; g.fillText('VOL ' + fmtVol(maxV), PAD.L + 2, PAD.T + priceH + 16);

  // last-price marker line
  const last = all[all.length - 1];
  const lastVisible = last && (all.length - 1) >= view.start && (all.length - 1) < view.start + view.count;
  if (lastVisible) {
    const y = yP(last.c);
    g.setLineDash([3, 3]);
    g.strokeStyle = last.c >= last.o ? 'rgba(0,229,160,0.55)' : 'rgba(255,45,78,0.55)';
    g.beginPath(); g.moveTo(PAD.L, y); g.lineTo(W - PAD.R, y); g.stroke();
    g.setLineDash([]);
    g.fillStyle = last.c >= last.o ? '#00E5A0' : '#FF2D4E';
    g.fillRect(W - PAD.R + 2, y - 7, PAD.R - 4, 14);
    g.fillStyle = '#0A050C';
    g.fillText(fmtPrice(last.c), W - PAD.R + 6, y);
  }

  // crosshair
  if (cross.active && cross.x != null) {
    g.setLineDash([2, 3]);
    g.strokeStyle = 'rgba(246,233,239,0.35)';
    g.beginPath(); g.moveTo(cross.x, PAD.T); g.lineTo(cross.x, H - PAD.B); g.stroke();
    if (cross.y != null && cross.y > PAD.T && cross.y < PAD.T + priceH) {
      g.beginPath(); g.moveTo(PAD.L, cross.y); g.lineTo(W - PAD.R, cross.y); g.stroke();
      const pv = lo + (1 - (cross.y - PAD.T) / priceH) * (hi - lo);
      g.setLineDash([]);
      g.fillStyle = '#281424';
      g.fillRect(W - PAD.R + 2, cross.y - 7, PAD.R - 4, 14);
      g.fillStyle = '#F6E9EF';
      g.fillText(fmtPrice(pv), W - PAD.R + 6, cross.y);
    }
    g.setLineDash([]);
  }

  updateOhlcReadout(k);
}

function updateOhlcReadout(k) {
  const ohlc = document.getElementById('ohlc');
  if (!ohlc || !k.length) return;
  const last = k[k.length - 1], first = k[0];
  const chg = ((last.c - first.o) / first.o) * 100;
  const tv = k.reduce((s, c) => s + c.v, 0);
  ohlc.innerHTML =
    `<span>O <b>${fmtPrice(last.o)}</b></span><span>H <b>${fmtPrice(last.h)}</b></span>` +
    `<span>L <b>${fmtPrice(last.l)}</b></span><span>C <b>${fmtPrice(last.c)}</b></span>` +
    `<span class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>` +
    `<span>VOL <b>${fmtVol(tv)}</b></span>`;
}

function setFollow(on) {
  view.follow = on;
  const b = document.getElementById('btnFollow');
  if (b) b.classList.toggle('on', on);
}

function bindChartInteraction() {
  const cv = document.getElementById('chart');
  if (!cv || cv.dataset.bound) return;
  cv.dataset.bound = '1';

  // ---- wheel zoom, anchored on the candle under the cursor ----
  cv.addEventListener('wheel', e => {
    if (!chartState.candles.length) return;
    e.preventDefault();
    const { W } = chartGeom(cv);
    const plotW = W - PAD.L - PAD.R;
    const rect = cv.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const frac = Math.max(0, Math.min(1, (mx - PAD.L) / plotW));
    const anchor = view.start + frac * view.count;

    const factor = e.deltaY > 0 ? 1.18 : 1 / 1.18;
    const n = chartState.candles.length;
    const next = Math.max(MIN_CANDLES, Math.min(n, view.count * factor));
    view.start = anchor - frac * next;
    view.count = next;
    setFollow(false);
    clampView();
    drawChart();
  }, { passive: false });

  // ---- drag to pan ----
  cv.addEventListener('mousedown', e => {
    drag.on = true;
    drag.x0 = e.clientX;
    drag.start0 = view.start;
    cv.classList.add('grabbing');
    setFollow(false);
  });
  window.addEventListener('mouseup', () => {
    drag.on = false;
    cv.classList.remove('grabbing');
  });

  cv.addEventListener('mousemove', e => {
    const rect = cv.getBoundingClientRect();
    const { W } = chartGeom(cv);
    const plotW = W - PAD.L - PAD.R;
    const step = plotW / view.count;

    if (drag.on) {
      const dx = e.clientX - drag.x0;
      view.start = drag.start0 - dx / step;
      clampView();
      drawChart();
      return;
    }

    cross.x = e.clientX - rect.left;
    cross.y = e.clientY - rect.top;
    cross.active = true;

    const idx = Math.round(view.start + (cross.x - PAD.L) / step - 0.5);
    const c = chartState.candles[idx];
    const tip = document.getElementById('ttip');
    if (tip) {
      if (c) {
        const d = new Date(c.t * 1000);
        tip.innerHTML = `${d.toLocaleTimeString()}<br>O ${fmtPrice(c.o)} H ${fmtPrice(c.h)}<br>L ${fmtPrice(c.l)} C ${fmtPrice(c.c)}<br>Vol ${fmtVol(c.v)}`;
        tip.style.left = Math.min(cross.x + 14, W - 160) + 'px';
        tip.style.top = '10px';
        tip.classList.add('show');
      } else tip.classList.remove('show');
    }
    drawChart();
  });

  cv.addEventListener('mouseleave', () => {
    cross.active = false;
    const tip = document.getElementById('ttip');
    if (tip) tip.classList.remove('show');
    drawChart();
  });

  // ---- double-click resets to fit ----
  cv.addEventListener('dblclick', () => {
    view.count = chartState.candles.length;
    view.start = 0;
    setFollow(true);
    drawChart();
  });

  // ---- toolbar buttons ----
  const zi = document.getElementById('btnZoomIn');
  const zo = document.getElementById('btnZoomOut');
  const fit = document.getElementById('btnFit');
  const fol = document.getElementById('btnFollow');
  if (zi) zi.onclick = () => { const mid = view.start + view.count / 2; view.count = Math.max(MIN_CANDLES, view.count / 1.4); view.start = mid - view.count / 2; setFollow(false); clampView(); drawChart(); };
  if (zo) zo.onclick = () => { const mid = view.start + view.count / 2; view.count = Math.min(chartState.candles.length, view.count * 1.4); view.start = mid - view.count / 2; setFollow(false); clampView(); drawChart(); };
  if (fit) fit.onclick = () => { view.count = chartState.candles.length; view.start = 0; setFollow(false); drawChart(); };
  if (fol) fol.onclick = () => { setFollow(!view.follow); if (view.follow) { view.start = Math.max(0, chartState.candles.length - view.count); } drawChart(); };
}

function wireChart(t){
  const g=document.getElementById('tfs'); if(!g) return;
  g.querySelectorAll('.tf').forEach(b=>{
    b.classList.toggle('active',b.dataset.tf===chartState.tf&&+b.dataset.agg===chartState.agg);
    b.onclick=()=>{
      chartState.tf=b.dataset.tf; chartState.agg=+b.dataset.agg; chartState.resetView=true;
      g.querySelectorAll('.tf').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); loadChart(t);
    };
  });
}
window.addEventListener('resize',()=>{ if(chartState.candles.length) drawChart(); });
setInterval(()=>{ if(chartState.token&&selectedId===chartState.token.id) loadChart(chartState.token); },30000);

function b64ToBytes(b64){ const bin=atob(b64), out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function connectPhantom(){
  if(!window.solana||!window.solana.isPhantom){ showToast('Phantom not detected — install the extension'); return null; }
  try{ const r=await window.solana.connect(); walletPubkey=r.publicKey.toString(); return walletPubkey; }
  catch{ showToast('Connection cancelled'); return null; }
}
function setTStat(msg,kind){ const a=document.getElementById('tstatArea'); if(a) a.innerHTML=`<div class="tstat ${kind}">${msg}</div>`; }
async function executeTrade(t){
  const inp=document.getElementById('amtIn');
  const amount=parseFloat(inp&&inp.value);
  if(!amount||amount<=0){ setTStat('Enter an amount first.','error'); return; }
  const btn=document.getElementById('execBtn'); if(btn) btn.disabled=true;
  setTStat('Building transaction…','pending');
  try{
    const r=await fetch('/api/trade/solana-build',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ publicKey:walletPubkey, action:side, mint:t.id, amount, denominatedInSol:side==='buy', slippage:10 })
    });
    const d=await r.json();
    if(!r.ok||!d.transaction) throw new Error(d.error||'Build failed');
    setTStat(d.feeApplied
      ? `Includes a ${(d.feeBps/100).toFixed(2)}% platform fee in this same transaction. Confirm in Phantom…`
      : 'Confirm in Phantom…','pending');
    const tx=solanaWeb3.VersionedTransaction.deserialize(b64ToBytes(d.transaction));
    const { signature }=await window.solana.signAndSendTransaction(tx);
    setTStat(`Sent. <a href="https://solscan.io/tx/${signature}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">View ↗</a>`,'success');
  }catch(e){ setTStat('Failed: '+(e.message||'unknown error'),'error'); }
  finally{ if(btn) btn.disabled=false; }
}

function connect(){
  const p=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${p}://${location.host}/live`);
  ws.onmessage=m=>{
    const d=JSON.parse(m.data);
    if(d.type==='snapshot'){
      if(!d.tokens.length) tokenlist.innerHTML=`<div class="list-empty">Nothing yet — Sentry is watching.<br>This fills in as tokens launch.</div>`;
      d.tokens.forEach(upsert);
    }
    if(d.type==='token'||d.type==='update') upsert(d.token);
    if(d.type==='feedStatus') (d.chain==='robinhood'?rhChip:solChip).classList.toggle('live',d.status==='connected');
    if(d.type==='solPrice') solUsd=d.usd;
  };
  ws.onclose=()=>{ solChip.classList.remove('live'); rhChip.classList.remove('live'); setTimeout(connect,2000); };
}
tokenlist.innerHTML=`<div class="list-empty">Connecting to live feeds…</div>`;
connect();

setInterval(()=>{
  document.querySelectorAll('[data-created]').forEach(el=>{
    const c=+el.dataset.created; if(c) el.textContent=fmtAge(Date.now()-c);
  });
},1000);
</script>
